<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; worker-src 'self';"
    />
    <title>Mono</title>
    <meta name="description" content="기기에만 키를 보관하는 개인 솔라나 지갑" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mono" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
    <!-- The mascot is the first thing on screen, so its 19 KB WebP starts
         downloading while the module graph is still being fetched. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="./assets/splash/mono-alien.webp"
      fetchpriority="high"
    />
    <style>
      /* The splash is plain HTML and CSS, painted before any script runs, so
         there is never a blank or half-drawn frame. Its colours come from the
         OS until the saved theme is applied, and follow it afterwards through
         the data-theme attribute that lives on <html>. */
      html,
      body {
        margin: 0;
        background: #ffffff;
      }
      #root {
        min-height: 100%;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #ffffff;
        opacity: 1;
        transition: opacity 380ms ease;
        will-change: opacity;
      }
      /* Two layers so the float and the entrance never fight over transform:
         the wrapper drifts, the mascot itself scales in and breathes. */
      #app-splash .splash-mark {
        display: flex;
        align-items: center;
        justify-content: center;
        animation: splash-float 4.8s cubic-bezier(0.45, 0, 0.55, 1) 900ms infinite;
        will-change: transform;
      }
      #app-splash img {
        display: block;
        width: clamp(148px, 44vw, 208px);
        height: auto;
        opacity: 0;
        transform: translateY(10px) scale(0.94);
        animation:
          splash-enter 760ms cubic-bezier(0.22, 1, 0.36, 1) 90ms forwards,
          splash-breathe 5.4s cubic-bezier(0.45, 0, 0.55, 1) 1000ms infinite;
        -webkit-user-select: none;
        user-select: none;
      }
      #app-splash .splash-word {
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
          'Helvetica Neue', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        text-transform: uppercase;
        color: #8b95a1;
        opacity: 0;
        transform: translateY(5px);
        animation: splash-word 620ms cubic-bezier(0.22, 1, 0.36, 1) 420ms forwards;
      }
      #app-splash[data-state='leaving'] {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes splash-enter {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes splash-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-7px);
        }
      }
      @keyframes splash-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.018);
        }
      }
      @keyframes splash-word {
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']),
        html:not([data-theme='light']) body {
          background: #090a0c;
        }
        html:not([data-theme='light']) #app-splash {
          background: #090a0c;
        }
        html:not([data-theme='light']) #app-splash .splash-word {
          color: #6c7480;
        }
        /* A matte black mascot on a near-black plate needs a little light
           around its silhouette, the same rim the dark mark is cut with. */
        html:not([data-theme='light']) #app-splash img {
          filter: drop-shadow(0 0 26px rgba(255, 255, 255, 0.14))
            drop-shadow(0 0 3px rgba(255, 255, 255, 0.1));
        }
      }
      @media (prefers-color-scheme: dark) and (prefers-reduced-motion: reduce) {
        #app-splash img {
          animation-duration: 1ms;
          animation-delay: 0ms;
        }
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #090a0c;
      }
      html[data-theme='dark'] #app-splash {
        background: #090a0c;
      }
      html[data-theme='dark'] #app-splash .splash-word {
        color: #6c7480;
      }
      html[data-theme='dark'] #app-splash img {
        filter: drop-shadow(0 0 26px rgba(255, 255, 255, 0.14))
          drop-shadow(0 0 3px rgba(255, 255, 255, 0.1));
      }
      html[data-theme='light'] #app-splash {
        background: #ffffff;
      }
      html[data-theme='light'] #app-splash .splash-word {
        color: #8b95a1;
      }
      html[data-theme='light'] #app-splash img {
        filter: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash {
          transition-duration: 1ms;
        }
        #app-splash .splash-mark {
          animation: none;
        }
        #app-splash img,
        #app-splash .splash-word {
          animation-duration: 1ms;
          animation-delay: 0ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="splash-mark">
        <img
          src="./assets/splash/mono-alien.webp"
          width="356"
          height="512"
          alt=""
          decoding="async"
          fetchpriority="high"
          draggable="false"
        />
      </div>
      <div class="splash-word">Mono</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
